name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v3.25)'
        required: false
        default: 'dev'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          
          # Install PySide6 first
          pip install PySide6==6.6.0
          
          # Install supabase and its dependencies
          pip install supabase==2.0.0
          pip install httpx httpcore postgrest certifi anyio sniffio h11
          pip install gotrue realtime storage3
          
          # Install other dependencies
          pip install requests pydantic cryptography appdirs boto3 websockets PyJWT bcrypt pydub tls-client camoufox
          
          # Install Nuitka
          pip install nuitka ordered-set zstandard
          
          # Verify installations
          python -c "import PySide6; print('PySide6:', PySide6.__version__)"
          python -c "import supabase; print('supabase OK')"
          python -c "import httpx; print('httpx OK')"
          python -c "import certifi; print('certifi:', certifi.where())"
          python -c "import boto3; print('boto3 OK')"
          python -c "import pydub; print('pydub OK')"
          python -c "import tls_client; print('tls-client OK')"
          python -c "import camoufox; print('camoufox OK')"

      - name: Download FFmpeg
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z x ffmpeg.zip -offmpeg_temp
          copy ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe .
          copy ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe .
          dir ffmpeg.exe
          dir ffprobe.exe

      - name: Build with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --windows-console-mode=disable `
            --output-filename=Elevenlabs_Unlimited.exe `
            --enable-plugin=pyside6 `
            --enable-plugin=anti-bloat `
            --include-package=supabase `
            --include-package=postgrest `
            --include-package=gotrue `
            --include-package=realtime `
            --include-package=storage3 `
            --include-package=httpx `
            --include-package=httpcore `
            --include-package=certifi `
            --include-package=anyio `
            --include-package=sniffio `
            --include-package=h11 `
            --include-package=requests `
            --include-package=pydantic `
            --include-package=cryptography `
            --include-package=websockets `
            --include-package=jwt `
            --include-package=bcrypt `
            --include-package=appdirs `
            --include-package=boto3 `
            --include-package=pydub `
            --include-package=tls_client `
            --include-package=camoufox `
            --include-package=services `
            --include-package=models `
            --include-package=ui `
            --include-package-data=PySide6 `
            --include-package-data=supabase `
            --include-package-data=requests `
            --include-package-data=cryptography `
            --include-package-data=pydantic `
            --include-package-data=certifi `
            --include-package-data=httpx `
            --include-data-dir=services=services `
            --include-data-dir=models=models `
            --include-data-dir=ui=ui `
            --include-data-file=ffmpeg.exe=ffmpeg.exe `
            --include-data-file=ffprobe.exe=ffprobe.exe `
            --nofollow-import-to=tkinter `
            --nofollow-import-to=_tkinter `
            --nofollow-import-to=tkinter.* `
            --nofollow-import-to=ttkbootstrap `
            --nofollow-import-to=PyQt6 `
            --nofollow-import-to=PyQt5 `
            --nofollow-import-to=PyQt4 `
            --nofollow-import-to=PySide2 `
            --nofollow-import-to=PySide `
            --nofollow-import-to=matplotlib `
            --nofollow-import-to=numpy `
            --nofollow-import-to=pandas `
            --nofollow-import-to=scipy `
            --nofollow-import-to=IPython `
            --nofollow-import-to=jupyter `
            --nofollow-import-to=wx `
            --nofollow-import-to=kivy `
            --nofollow-import-to=trio `
            --no-pyi-file `
            --assume-yes-for-downloads `
            --show-progress `
            11Labs0811.py

      - name: Verify output
        run: |
          dir Elevenlabs_Unlimited.exe
          echo "Build successful!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elevenlabs_Unlimited-windows
          path: Elevenlabs_Unlimited.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: Elevenlabs_Unlimited.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
